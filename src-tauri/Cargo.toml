[package]
name = "otel-viewer-tauri"
version = "0.1.0"
description = "otel-viewer: all-in-one desktop app (OTLP collector + DuckDB + web UI)"
edition = "2021"

[lib]
name = "otel_viewer_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
otel-viewer = { path = ".." }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
anyhow = "1"
url = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
